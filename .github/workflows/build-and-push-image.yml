name: build-and-push-image

on: workflow_dispatch
permissions:
      id-token: write
      contents: read
env:
  registryName: ${{ vars.REGISTRY_NAME }}
  repositoryName: ${{ vars.REPOSITORY_NAME }}
  tag: ${{ vars.TAG }}

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: 'Az CLI login'
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
    - name: 'Login to Specified ACR'
      run: az acr login -n $registryName
      
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: Build the Docker Image
      run: docker build . --file Dockerfile --tag "$registryName.azurecr.io/$repositoryName:$tag"

    - name: 'Push the Docker Image'
      run: docker push "$registryName.azurecr.io/$repositoryName:$tag"
